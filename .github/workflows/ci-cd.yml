name: CI/CD

on:
  pull_request:
  push:
    branches:
      - development
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: SQLX_OFFLINE=true cargo test --locked

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  dependency-security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --file backend/Cargo.lock
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: bun audit --audit-level=high
        working-directory: frontend
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --severity=HIGH,CRITICAL
            .

  publish:
    name: Publish ${{ github.ref_name }} images
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-tests, dependency-security]
    runs-on: ubuntu-latest
    concurrency:
      group: image-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        include:
          - name: platform-back
            file: backend/Dockerfile
          - name: platform-front
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate production version
        id: version
        if: github.ref_name == 'main'
        run: |
          git fetch --tags --force
          last_version=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next_version=$(( ${last_version:-0} + 1 ))
          echo "version=v${next_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next_version}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=staging,enable=${{ github.ref_name == 'development' }}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version || 'staging' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release-tag:
    name: Create production version tag
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create version tag
        run: |
          git fetch --tags --force
          last_version=$(git tag --list 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          next_version=$(( ${last_version:-0} + 1 ))
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "v${next_version}"
          git push origin "v${next_version}"
