services:
  production-platform-back:
    container_name: production-platform-back
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-back:${VERSION:?Defina VERSION, por exemplo v1}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?Defina PRODUCTION_DATABASE_URL}
      INTERNAL_SECRET: ${PRODUCTION_INTERNAL_SECRET:?Defina PRODUCTION_INTERNAL_SECRET}
      BIND_ADDR: 0.0.0.0:3000
      PUBLIC_APP_URL: ${PRODUCTION_PUBLIC_APP_URL:?Defina PRODUCTION_PUBLIC_APP_URL}
      SMTP_HOST: ${PRODUCTION_SMTP_HOST:?Defina PRODUCTION_SMTP_HOST}
      SMTP_PORT: ${PRODUCTION_SMTP_PORT:-587}
      SMTP_USERNAME: ${PRODUCTION_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${PRODUCTION_SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${PRODUCTION_SMTP_FROM_EMAIL:?Defina PRODUCTION_SMTP_FROM_EMAIL}
      SMTP_STARTTLS: ${PRODUCTION_SMTP_STARTTLS:-true}
    expose:
      - "3000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  production-platform-front:
    container_name: production-platform-front
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-front:${VERSION:?Defina VERSION, por exemplo v1}
    restart: unless-stopped
    depends_on:
      - production-platform-back
    environment:
      BACKEND_URL: http://production-platform-back:3000
      INTERNAL_SECRET: ${PRODUCTION_INTERNAL_SECRET:?Defina PRODUCTION_INTERNAL_SECRET}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${PRODUCTION_PORT:-80}:3000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  staging-platform-back:
    container_name: staging-platform-back
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-back:staging
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL:?Defina STAGING_DATABASE_URL}
      INTERNAL_SECRET: ${STAGING_INTERNAL_SECRET:?Defina STAGING_INTERNAL_SECRET}
      BIND_ADDR: 0.0.0.0:3000
      PUBLIC_APP_URL: ${STAGING_PUBLIC_APP_URL:?Defina STAGING_PUBLIC_APP_URL}
      SMTP_HOST: ${STAGING_SMTP_HOST:-}
      SMTP_PORT: ${STAGING_SMTP_PORT:-587}
      SMTP_USERNAME: ${STAGING_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${STAGING_SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${STAGING_SMTP_FROM_EMAIL:-}
      SMTP_STARTTLS: ${STAGING_SMTP_STARTTLS:-true}
    expose:
      - "3000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  staging-platform-front:
    container_name: staging-platform-front
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-front:staging
    restart: unless-stopped
    depends_on:
      - staging-platform-back
    environment:
      BACKEND_URL: http://staging-platform-back:3000
      INTERNAL_SECRET: ${STAGING_INTERNAL_SECRET:?Defina STAGING_INTERNAL_SECRET}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${STAGING_PORT:-5173}:3000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  platform:
    driver: bridge
