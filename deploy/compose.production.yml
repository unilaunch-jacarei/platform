services:
  migrate:
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-back:${VERSION:?Defina VERSION, por exemplo v1}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Defina INTERNAL_SECRET}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:?Defina RATE_LIMIT_STORAGE_URI, por exemplo redis://redis:6379/0}
      ENVIRONMENT: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Defina SMTP_FROM_EMAIL}
    networks:
      - platform

  backend:
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-back:${VERSION:?Defina VERSION, por exemplo v1}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Defina INTERNAL_SECRET}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:?Defina RATE_LIMIT_STORAGE_URI, por exemplo redis://redis:6379/0}
      BIND_ADDR: 0.0.0.0:8000
      ENVIRONMENT: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Defina PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST:?Defina SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Defina SMTP_FROM_EMAIL}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    expose:
      - "8000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    image: ghcr.io/${GHCR_OWNER:?Defina GHCR_OWNER}/platform-front:${VERSION:?Defina VERSION, por exemplo v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      BACKEND_URL: http://backend:8000
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Defina INTERNAL_SECRET}
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${PRODUCTION_PORT:-80}:3000"
    networks:
      - platform
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  platform:
    driver: bridge
